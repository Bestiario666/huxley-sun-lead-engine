name: Huxley Sun Automatic Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * 1"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

concurrency:
  group: huxley-sun-automatic-pipeline
  cancel-in-progress: false

jobs:

  huxley-sun-pipeline:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      READY_REFILL_THRESHOLD: "30"

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate pipeline files before doing anything
        run: |
          test -f lead_search.py
          test -f outreach_prep.py
          test -f pipeline_gate.py

          python -m py_compile \
            lead_search.py \
            outreach_prep.py \
            pipeline_gate.py

          echo "Pipeline file validation: PASS"

      - name: Prepare any existing NEW leads first
        run: python outreach_prep.py

      - name: Check whether the READY queue needs a refill
        id: gate
        run: python pipeline_gate.py

      - name: Queue is healthy - skip paid discovery
        if: steps.gate.outputs.run_discovery == 'false'
        run: |
          echo "READY queue: ${{ steps.gate.outputs.ready_count }}"
          echo "Paid discovery skipped."
          echo "OpenAI discovery cost: $0"

      - name: Run lead discovery once
        if: steps.gate.outputs.run_discovery == 'true'
        run: python lead_search.py

      - name: Prepare newly discovered leads
        if: steps.gate.outputs.run_discovery == 'true'
        run: python outreach_prep.py

      - name: Final READY queue report
        run: python pipeline_gate.py
