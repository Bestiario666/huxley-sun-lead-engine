name: Huxley Sun Automatic Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * 1"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

concurrency:
  group: huxley-sun-automatic-pipeline
  cancel-in-progress: false

jobs:
  huxley-sun-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      READY_REFILL_THRESHOLD: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate all pipeline files before API work
        run: |
          test -f lead_search.py
          test -f outreach_prep.py
          test -f pipeline_gate.py

          python -m py_compile \
            lead_search.py \
            outreach_prep.py \
            pipeline_gate.py

          echo "Pipeline file validation: PASS"

      - name: Check READY queue before doing any AI work
        id: gate_before
        run: python pipeline_gate.py

      - name: Healthy queue - no AI work needed
        if: ${{ steps.gate_before.outputs.run_discovery == 'false' }}
        run: |
          echo "Sendable READY queue: ${{ steps.gate_before.outputs.ready_count }}"
          echo "Skipping outreach prep."
          echo "Skipping paid discovery."

      - name: Prepare existing NEW leads
        if: ${{ steps.gate_before.outputs.run_discovery == 'true' }}
        run: python outreach_prep.py

      - name: Recheck READY queue after prep
        if: ${{ steps.gate_before.outputs.run_discovery == 'true' }}
        id: gate_after_prep
        run: python pipeline_gate.py

      - name: Existing leads refilled queue - skip discovery
        if: ${{ steps.gate_before.outputs.run_discovery == 'true' && steps.gate_after_prep.outputs.run_discovery == 'false' }}
        run: |
          echo "Existing NEW leads were enough."
          echo "Paid discovery skipped."

      - name: Run lead discovery once
        if: ${{ steps.gate_before.outputs.run_discovery == 'true' && steps.gate_after_prep.outputs.run_discovery == 'true' }}
        run: python lead_search.py

      - name: Prepare newly discovered leads
        if: ${{ steps.gate_before.outputs.run_discovery == 'true' && steps.gate_after_prep.outputs.run_discovery == 'true' }}
        run: python outreach_prep.py

      - name: Final READY queue report
        run: python pipeline_gate.py
