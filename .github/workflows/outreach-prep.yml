name: Huxley Sun Outreach Prep - Manual Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huxley-sun-automatic-pipeline
  cancel-in-progress: false

jobs:
  prepare-outreach-manually:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      READY_REFILL_THRESHOLD: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate manual prep files
        run: |
          test -f outreach_prep.py
          test -f pipeline_gate.py

          python -m py_compile \
            outreach_prep.py \
            pipeline_gate.py

          echo "Manual prep validation: PASS"

      - name: Prepare outreach drafts
        run: python outreach_prep.py

      - name: Report resulting READY queue
        run: python pipeline_gate.py
